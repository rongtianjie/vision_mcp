[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-mcp"
version = "1.0.0"
description = "MCP server that bridges LLMs without vision to multimodal models via OpenAI-compatible APIs"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
    "mcp>=1.0",
]

[project.scripts]
vision-mcp = "vision_mcp:main"

[tool.setuptools.packages.find]
include = ["vision_mcp*"]
where = ["."]
